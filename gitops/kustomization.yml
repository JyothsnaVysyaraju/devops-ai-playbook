apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique

resources:
  - namespace.yml
  - secrets.yml
  - k8s/database/statefulset.yml
  - k8s/database/service.yml
  - k8s/backend/gateway.yml
  - k8s/backend/service-monitor.yml
  - k8s/backend/auth.yml
  - k8s/backend/product-service.yml
  - k8s/backend/order-service.yml
  - k8s/backend/orders.yml
  - k8s/backend/user-service.yml
  - k8s/frontend/deployment.yml
  - k8s/grafana-dashboard.yml

configMapGenerator:
  - name: boutique-db-dump
    files:
      - k8s/database/boutique_full.sql

generatorOptions:
  disableNameSuffixHash: true

images:
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/auth
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/auth
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/frontend
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/frontend
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/gateway
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/gateway
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/order-service
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/order-service
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/orders
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/orders
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/product-service
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/product-service
  - name: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/user-service
    newName: 376432388468.dkr.ecr.us-east-1.amazonaws.com/user-service
